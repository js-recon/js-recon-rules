id: detect_taintwire_unsafe_dynamic_method_call
name: "Unsafe dynamic method call: URL or window.name value selects the method to call (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0-alpha.2"
description: >-
    Taint flow from a URL read (location.hash/search/href,
    document.URL/documentURI/referrer/baseURI) or window.name into the computed property of a
    call (obj[name](...)). An attacker chooses which method runs, for example constructor, a
    privileged handler, or a gadget such as Function via obj.constructor.constructor.
severity: medium
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '\blocation\b|\bdocument\s*\.\s*(?:URL|documentURI|referrer|baseURI)\b|\bwindow\s*\.\s*name\b'

steps:
    - name: url_source
      message: "URL or window.name value read"
      taintwire:
          query:
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o)
                  WHERE (p.name IN ['hash', 'search', 'href'] AND (o.name = 'location' OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name = 'location' }))
                     OR (p.name IN ['URL', 'documentURI', 'referrer', 'baseURI'] AND o.name = 'document')
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE o.name = 'window' AND p.name = 'name'
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
    - name: dispatch_sink
      message: "URL-derived value selects a method to call"
      taintwire:
          taintFrom: url_source
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(m:MemberExpression)-[:SON {key: 'property'}]->(n)
                  WHERE m.props CONTAINS '"computed":true' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, 'obj[key]()' AS kind, n.file AS file, n.line AS line, n.col AS col
