id: detect_taintwire_link_manipulation_url
name: "Link manipulation: URL value reaches a resource URL attribute (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0-alpha.2"
description: >-
    Taint flow from location.hash/search or document.URL/documentURI/referrer/baseURI
    (location.href is not a source here: frameworks and libraries routinely use the current
    URL) into a URL-valued element attribute or property:
    .src/.action/.formAction/.data/.poster/.srcset/.background/.ping/.codebase/.cite,
    setAttribute of data/poster/srcset/xlink:href/background/ping/codebase/cite,
    setAttributeNS of href/xlink:href/src, or jQuery .attr()/.prop() of
    href/src/action/formaction/data/srcdoc. A javascript: URL in a navigable attribute runs
    script; other values redirect resources or form submissions.
severity: medium
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '\blocation\b|\bdocument\s*\.\s*(?:URL|documentURI|referrer|baseURI)\b'

steps:
    - name: url_source
      message: "URL value read"
      taintwire:
          query:
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o)
                  WHERE (p.name IN ['hash', 'search'] AND (o.name = 'location' OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name = 'location' }))
                     OR (p.name IN ['URL', 'documentURI', 'referrer', 'baseURI'] AND o.name = 'document')
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
    - name: link_sink
      message: "URL-derived value reaches a URL-valued attribute"
      taintwire:
          taintFrom: url_source
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (asg:AssignmentExpression)-[:SON {key: 'left'}]->(l:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (asg)-[:SON {key: 'right'}]->(n)
                  WHERE p.name IN ['src', 'action', 'formAction', 'data', 'poster', 'srcset', 'background', 'ping', 'codebase', 'cite'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name + '=' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['setAttribute'] AND a0.idx = 0 AND a1.idx = 1 AND k.value IN ['data', 'poster', 'srcset', 'xlink:href', 'background', 'ping', 'codebase', 'cite'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:TemplateLiteral)-[:SON {key: 'quasis'}]->(kq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['setAttribute'] AND a0.idx = 0 AND a1.idx = 1 AND kq.value IN ['data', 'poster', 'srcset', 'xlink:href', 'background', 'ping', 'codebase', 'cite'] AND k.props CONTAINS '"expressions":[]' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['setAttributeNS'] AND a0.idx = 1 AND a1.idx = 2 AND k.value IN ['href', 'xlink:href', 'src'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:TemplateLiteral)-[:SON {key: 'quasis'}]->(kq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['setAttributeNS'] AND a0.idx = 1 AND a1.idx = 2 AND kq.value IN ['href', 'xlink:href', 'src'] AND k.props CONTAINS '"expressions":[]' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['attr', 'prop'] AND a0.idx = 0 AND a1.idx = 1 AND k.value IN ['href', 'src', 'action', 'formaction', 'formAction', 'data', 'srcdoc'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:TemplateLiteral)-[:SON {key: 'quasis'}]->(kq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['attr', 'prop'] AND a0.idx = 0 AND a1.idx = 1 AND kq.value IN ['href', 'src', 'action', 'formaction', 'formAction', 'data', 'srcdoc'] AND k.props CONTAINS '"expressions":[]' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
