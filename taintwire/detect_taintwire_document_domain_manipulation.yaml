id: detect_taintwire_document_domain_manipulation
name: "Document-domain manipulation: URL value written to document.domain (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0-alpha.2"
description: >-
    Taint flow from a URL read (location.hash/search/href,
    document.URL/documentURI/referrer/baseURI) into document.domain. Lets an attacker relax
    the page's origin to a parent domain they share, so a page on a sibling subdomain can
    script this one.
severity: medium
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '\blocation\b|\bdocument\s*\.\s*(?:URL|documentURI|referrer|baseURI)\b'

steps:
    - name: url_source
      message: "URL value read"
      taintwire:
          query:
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o)
                  WHERE (p.name IN ['hash', 'search', 'href'] AND (o.name = 'location' OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name = 'location' }))
                     OR (p.name IN ['URL', 'documentURI', 'referrer', 'baseURI'] AND o.name = 'document')
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
    - name: domain_sink
      message: "URL-derived value written to document.domain"
      taintwire:
          taintFrom: url_source
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (asg:AssignmentExpression)-[:SON {key: 'left'}]->(l:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (asg)-[:SON {key: 'right'}]->(n), (l)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE p.name IN ['domain'] AND o.name = 'document' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name + '=' AS kind, n.file AS file, n.line AS line, n.col AS col
