id: detect_taintwire_insecure_randomness
name: "Insecure randomness: Math.random() value stored or sent under a secret's name (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0-alpha.2"
description: >-
    Taint flow from Math.random() into a cookie, a localStorage/sessionStorage.setItem() key
    or a request header whose name says it holds a secret (token, session, sid, nonce,
    csrf/xsrf, auth, secret, otp, state, key, pass, salt, verifier). Math.random() is
    predictable, so a session id, CSRF token or nonce generated with it can be guessed. Use
    crypto.getRandomValues() or crypto.randomUUID(). Ids, sample rates and storage probes
    under other names are not reported.
severity: low
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '\bMath\s*\.\s*random\b'

steps:
    - name: random_source
      message: "Math.random() value generated"
      taintwire:
          query:
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (cm)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE p.name = 'random' AND o.name = 'Math'
                  RETURN c.id AS id, 'Math.random' AS kind, c.file AS file, c.line AS line, c.col AS col
              - |-
                  MATCH (w)-[e:SON*1..8 (r, _ | WHERE r.key IN ['object', 'callee'])]->(c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (cm)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE p.name = 'random' AND o.name = 'Math'
                  RETURN DISTINCT w.id AS id, 'Math.random chain' AS kind, w.file AS file, w.line AS line, w.col AS col
    - name: token_sink
      message: "Math.random()-derived value stored or sent as a token"
      taintwire:
          taintFrom: random_source
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (a:AssignmentExpression)-[:SON {key: 'left'}]->(l:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (l)-[:SON {key: 'object'}]->(o:Identifier), (a)-[:SON {key: 'right'}]->(n)
                  WHERE p.name = 'cookie' AND o.name = 'document' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral'] AND (EXISTS { MATCH (n)-[:SON*0..1 (zw, _ | WHERE zw.key = 'arguments' AND zw.idx = 0)]->(zv)-[:SON*1..12 (zr, zx | WHERE zr.key = 'left' AND zx.operator = '+')]->(zl)
                  WHERE zv.operator = '+' AND zl.type = 'StringLiteral' AND zl.value =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*' }
                   OR EXISTS { MATCH (n)-[:SON*0..1 (zw, _ | WHERE zw.key = 'arguments' AND zw.idx = 0)]->(zv)-[zq:SON {key: 'quasis'}]->(ze)
                  WHERE zv.type = 'TemplateLiteral' AND zq.idx = 0 AND ze.value =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*' })
                  RETURN n.id AS id, 'cookie' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n), (c)-[a0:SON {key: 'arguments'}]->(k), (cm)-[:SON {key: 'object'}]->(o)
                  WHERE p.name = 'setItem' AND a.idx = 1 AND a0.idx = 0 AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral'] AND (o.name IN ['localStorage', 'sessionStorage'] OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name IN ['localStorage', 'sessionStorage'] })
                    AND ((coalesce(k.name, k.value) =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*') OR (EXISTS { MATCH (k)-[:SON*0..1 (zw, _ | WHERE zw.key = 'arguments' AND zw.idx = 0)]->(zv)-[:SON*1..12 (zr, zx | WHERE zr.key = 'left' AND zx.operator = '+')]->(zl)
                  WHERE zv.operator = '+' AND zl.type = 'StringLiteral' AND zl.value =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*' }
                   OR EXISTS { MATCH (k)-[:SON*0..1 (zw, _ | WHERE zw.key = 'arguments' AND zw.idx = 0)]->(zv)-[zq:SON {key: 'quasis'}]->(ze)
                  WHERE zv.type = 'TemplateLiteral' AND zq.idx = 0 AND ze.value =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*' }))
                  RETURN n.id AS id, 'setItem' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n), (c)-[a0:SON {key: 'arguments'}]->(k)
                  WHERE a.idx = 1 AND a0.idx = 0 AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral'] AND (coalesce(k.name, k.value) =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*')
                    AND (p.name = 'setRequestHeader' OR (p.name IN ['set', 'append'] AND EXISTS { MATCH (cm)-[:SON {key: 'object'}]->(zh)-[:SON {key: 'property'}]->(zp) WHERE zp.name = 'headers' }))
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (op:ObjectProperty)-[:SON {key: 'key'}]->(k), (op)-[:SON {key: 'value'}]->(n)
                  WHERE NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral'] AND (coalesce(k.name, k.value) =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*')
                    AND EXISTS { MATCH (zh:ObjectProperty)-[:SON {key: 'key'}]->(zk), (zh)-[:SON {key: 'value'}]->(zo)-[:SON {key: 'properties'}]->(op) WHERE zk.name = 'headers' }
                  RETURN n.id AS id, 'headers:' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (asg:AssignmentExpression)-[:SON {key: 'left'}]->(l:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (asg)-[:SON {key: 'right'}]->(n), (l)-[:SON {key: 'object'}]->(:MemberExpression)-[:SON {key: 'property'}]->(h:Identifier)
                  WHERE h.name = 'headers' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral'] AND (coalesce(p.name, p.value) =~ '(?i).*(token|sess|sid|nonce|csrf|xsrf|auth|secret|otp|state|key|pass|salt|verifier).*')
                  RETURN n.id AS id, p.name + '=' AS kind, n.file AS file, n.line AS line, n.col AS col
