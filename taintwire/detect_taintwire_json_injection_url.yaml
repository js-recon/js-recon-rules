id: detect_taintwire_json_injection_url
name: "Client-side JSON injection: URL or window.name value parsed as JSON (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0-alpha.2"
description: >-
    Taint flow from a URL read (location.hash/search/href,
    document.URL/documentURI/referrer/baseURI) or window.name into JSON.parse() or jQuery
    $.parseJSON(). Low severity on its own: it lets an attacker shape objects the page trusts
    (feature flags, configuration, nested keys for prototype pollution). Flows on to an HTML
    sink are reported by the DOM XSS rules.
severity: low
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '\blocation\b|\bdocument\s*\.\s*(?:URL|documentURI|referrer|baseURI)\b|\bwindow\s*\.\s*name\b'

steps:
    - name: url_source
      message: "URL or window.name value read"
      taintwire:
          query:
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o)
                  WHERE (p.name IN ['hash', 'search', 'href'] AND (o.name = 'location' OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name = 'location' }))
                     OR (p.name IN ['URL', 'documentURI', 'referrer', 'baseURI'] AND o.name = 'document')
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (n)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE o.name = 'window' AND p.name = 'name'
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
    - name: json_sink
      message: "URL-derived value parsed as JSON"
      taintwire:
          taintFrom: url_source
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n), (cm)-[:SON {key: 'object'}]->(o:Identifier)
                  WHERE p.name IN ['parse'] AND a.idx = 0 AND o.name = 'JSON' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['parseJSON'] AND a.idx = 0 AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral', 'RegExpLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
