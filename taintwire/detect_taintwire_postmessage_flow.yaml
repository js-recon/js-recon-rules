id: detect_taintwire_postmessage_flow
name: "postMessage data reaches an HTML, JS execution or navigation sink (taintwire)"
author: shriyanss
js_recon_version: ">=2.1.0"
description: >-
    Taint flow from the data of a message event (the first parameter's .data in an
    addEventListener('message', h) or onmessage = h listener, h inline or a named
    function/const) into an HTML sink, a JavaScript execution sink (eval, Function, string
    timers) or a navigation sink (location assignment, href, location.assign/replace,
    window.open, setAttribute of href/src/action/formaction/srcdoc). Does not check whether
    the listener validates event.origin.
severity: high
type: taintwire
tech:
    - next
    - vue
    - react
    - svelte
    - angular
prefilter: '["''`]message["''`]|\bonmessage\b'

steps:
    - name: handler
      message: "message event handler registered"
      taintwire:
          query:
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(:MemberExpression)-[:SON {key: 'property'}]->(ae:Identifier),
                        (c)-[a0:SON {key: 'arguments'}]->(t:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(h)
                  WHERE ae.name = 'addEventListener' AND a0.idx = 0 AND a1.idx = 1 AND t.value = 'message'
                  RETURN h.id AS id
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(:MemberExpression)-[:SON {key: 'property'}]->(ae:Identifier),
                        (c)-[a0:SON {key: 'arguments'}]->(t:TemplateLiteral)-[:SON {key: 'quasis'}]->(tq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(h)
                  WHERE ae.name = 'addEventListener' AND a0.idx = 0 AND a1.idx = 1 AND tq.value = 'message' AND t.props CONTAINS '"expressions":[]'
                  RETURN h.id AS id
              - |-
                  MATCH (a:AssignmentExpression)-[:SON {key: 'left'}]->(:MemberExpression)-[:SON {key: 'property'}]->(om:Identifier), (a)-[:SON {key: 'right'}]->(h)
                  WHERE om.name = 'onmessage'
                  RETURN h.id AS id
    - name: listener
      message: "message listener function resolved"
      taintwire:
          query:
              - |-
                  MATCH (f) WHERE f.id IN $handler AND f.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] RETURN f.id AS id
              - |-
                  MATCH (h:Identifier)-[:REFERS_TO]->(d:Identifier)<-[:SON {key: 'id'}]-(x)
                  WHERE h.id IN $handler
                  OPTIONAL MATCH (x)-[:SON {key: 'init'}]->(i)
                  WITH CASE WHEN x.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] THEN x.id ELSE i.id END AS fid, CASE WHEN x.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] THEN x.type ELSE i.type END AS ft
                  WHERE ft IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration']
                  RETURN fid AS id
    - name: message_data
      message: "message event data read"
      taintwire:
          query:
              - |-
                  MATCH (f)-[:SON {key: 'params', idx: 0}]->(d:Identifier)<-[:REFERS_TO]-(e:Identifier)<-[:SON {key: 'object'}]-(n:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier)
                  WHERE f.id IN $listener AND p.name = 'data'
                  RETURN n.id AS id, 'data' AS kind, n.file AS file, n.line AS line, n.col AS col
    - name: message_sink
      message: "message event data reaches an HTML, JS execution or navigation sink"
      taintwire:
          taintFrom: message_data
          mode: deep
          maxHops: 8
          query:
              - |-
                  MATCH (a:AssignmentExpression)-[:SON {key: 'left'}]->(:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (a)-[:SON {key: 'right'}]->(n)
                  WHERE p.name IN ['innerHTML', 'outerHTML', 'srcdoc', 'cssText'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n), (cm)-[:SON {key: 'object'}]->(o)
                  WHERE ((p.name IN ['write', 'writeln'] AND o.name = 'document' AND a.idx = 0)
                     OR (p.name = 'insertAdjacentHTML' AND a.idx = 1)
                     OR (p.name IN ['html', 'createContextualFragment', 'setHTMLUnsafe'] AND a.idx = 0)) AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (o:ObjectProperty)-[:SON {key: 'key'}]->(k:Identifier), (o)-[:SON {key: 'value'}]->(n)
                  WHERE k.name IN ['__html', 'innerHTML', 'outerHTML'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, k.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (o:ObjectProperty)-[:SON {key: 'key'}]->(k:StringLiteral), (o)-[:SON {key: 'value'}]->(n)
                  WHERE k.value IN ['__html', 'innerHTML', 'outerHTML'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, k.value AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[a0:SON {key: 'arguments'}]->(k:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE a1.idx = a0.idx + 1 AND k.value IN ['innerHTML', 'outerHTML', 'srcdoc'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'property-call' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[a0:SON {key: 'arguments'}]->(k:TemplateLiteral)-[:SON {key: 'quasis'}]->(kq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE a1.idx = a0.idx + 1 AND kq.value IN ['innerHTML', 'outerHTML', 'srcdoc'] AND k.props CONTAINS '"expressions":[]' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'property-call' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(f:Identifier), (c)-[a:SON {key: 'arguments'}]->(n)
                  WHERE ((f.name IN ['eval', 'setTimeout', 'setInterval'] AND a.idx = 0) OR f.name = 'Function') AND NOT n.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, f.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:NewExpression)-[:SON {key: 'callee'}]->(f:Identifier), (c)-[a:SON {key: 'arguments'}]->(n)
                  WHERE ((f.name IN ['eval', 'setTimeout', 'setInterval'] AND a.idx = 0) OR f.name = 'Function') AND NOT n.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, f.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n)
                  WHERE p.name IN ['eval', 'setTimeout', 'setInterval'] AND a.idx = 0 AND NOT n.type IN ['FunctionExpression', 'ArrowFunctionExpression', 'FunctionDeclaration'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (a:AssignmentExpression)-[:SON {key: 'left'}]->(l:Identifier), (a)-[:SON {key: 'right'}]->(n)
                  WHERE l.name = 'location' AND NOT EXISTS { MATCH (l)-[:REFERS_TO]->() } AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'location=' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (a:AssignmentExpression)-[:SON {key: 'left'}]->(:MemberExpression)-[:SON {key: 'property'}]->(q:Identifier), (a)-[:SON {key: 'right'}]->(n)
                  WHERE q.name IN ['location', 'href'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, q.name + '=' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a:SON {key: 'arguments'}]->(n), (cm)-[:SON {key: 'object'}]->(o)
                  WHERE a.idx = 0 AND ((p.name IN ['assign', 'replace'] AND (o.name = 'location' OR EXISTS { MATCH (o)-[:SON {key: 'property'}]->(q:Identifier) WHERE q.name = 'location' })) OR (p.name = 'open' AND o.name = 'window')) AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, p.name AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:StringLiteral), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name = 'setAttribute' AND a0.idx = 0 AND a1.idx = 1 AND k.value IN ['href', 'src', 'action', 'formaction', 'srcdoc'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'setAttribute' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k:TemplateLiteral)-[:SON {key: 'quasis'}]->(kq:TemplateElement), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name = 'setAttribute' AND a0.idx = 0 AND a1.idx = 1 AND kq.value IN ['href', 'src', 'action', 'formaction', 'srcdoc'] AND k.props CONTAINS '"expressions":[]' AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'setAttribute' AS kind, n.file AS file, n.line AS line, n.col AS col
              - |-
                  MATCH (c:CallExpression)-[:SON {key: 'callee'}]->(cm:MemberExpression)-[:SON {key: 'property'}]->(p:Identifier), (c)-[a0:SON {key: 'arguments'}]->(k), (c)-[a1:SON {key: 'arguments'}]->(n)
                  WHERE p.name = 'setAttribute' AND a0.idx = 0 AND a1.idx = 1 AND NOT k.type IN ['StringLiteral', 'TemplateLiteral'] AND NOT n.type IN ['StringLiteral', 'NumericLiteral', 'NullLiteral', 'BooleanLiteral']
                  RETURN n.id AS id, 'setAttribute:dynamic' AS kind, n.file AS file, n.line AS line, n.col AS col
