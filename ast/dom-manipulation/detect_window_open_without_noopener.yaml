id: detect_window_open_without_noopener
name: "window.open to a new tab without noopener (reverse tabnabbing)"
author: shriyanss
js_recon_version: ">=1.4.1-alpha.4"
description: >-
    Detects window.open(url, '_blank') with no windowFeatures argument. Unlike <a
    target=_blank>, window.open does not imply noopener, so the opened page gets window.opener
    and can navigate this tab (for example to a phishing copy of it). Pass
    'noopener,noreferrer' as the third argument, or set opener = null on the result.
severity: info
type: ast
tech:
    - next
    - vue
    - react
    - svelte
    - angular

steps:
    - name: find_window_open_blank
      message: "window.open(..., '_blank') without windowFeatures"
      esquery:
          type: esquery
          query: 'CallExpression[callee.object.name="window"][callee.property.name="open"][arguments.length=2]:matches([arguments.1.value="_blank"], [arguments.1.quasis.0.value.cooked="_blank"][arguments.1.expressions.length=0])'
